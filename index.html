<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Random Matchmaking Chat — Pro UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      /* ====== BASE / THEME ====== */
      :root {
        --bg: #0f1724;
        --card: #0b1220;
        --muted: #9aa7bb;
        --accent: linear-gradient(90deg, #4f8cff, #6b7bff);
        --glass: rgba(255, 255, 255, 0.03);
        --chip-bg: rgba(255, 255, 255, 0.03);
        --glass-2: rgba(255, 255, 255, 0.02);
        --success: #22c55e;
        --danger: #ff6b6b;
      }

      /* Reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
      html,
      body {
        height: 100%;
      }

      body {
        background: radial-gradient(
            1200px 600px at -10% -10%,
            rgba(80, 110, 255, 0.06),
            transparent
          ),
          radial-gradient(
            900px 500px at 110% 110%,
            rgba(100, 220, 200, 0.02),
            transparent
          ),
          var(--bg);
        color: #e6eef8;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding: 28px;
      }

      /* Page wrapper */
      .app {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 20px;
        min-height: calc(100vh - 56px);
      }

      /* Username modal (initial) */
      #usernameBox {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 420px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 8px 30px rgba(2, 6, 23, 0.6);
        backdrop-filter: blur(6px);
        z-index: 40;
      }
      #usernameBox h2 {
        font-size: 20px;
        margin-bottom: 8px;
        color: #f7fbff;
      }
      #username {
        width: 100%;
        padding: 12px 14px;
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #dceefe;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      #joinBtn {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        font-weight: 600;
        background: linear-gradient(90deg, #3f80ff, #7b6dff);
        color: white;
        box-shadow: 0 6px 18px rgba(64, 96, 255, 0.12);
      }

      /* Left panel - match + video */
      .card {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.015)
        );
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 6px 24px rgba(5, 10, 25, 0.6);
        position: relative;
        overflow: hidden;
      }

      #leftPanelHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }
      #leftPanelHeader h2 {
        font-size: 18px;
        color: #f3f7ff;
      }
      .small-muted {
        color: var(--muted);
        font-size: 13px;
      }

      /* Controls row */
      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .btn {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #eaf3ff;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn.primary {
        background: linear-gradient(90deg, #3f80ff, #7b6dff);
        border: 0;
        box-shadow: 0 8px 18px rgba(91, 84, 255, 0.12);
      }
      .btn.ghost {
        background: transparent;
      }
      .btn.warn {
        background: linear-gradient(90deg, #ff7b7b, #ffb07b);
        border: 0;
      }

      /* Match info */
      #matchStatus {
        font-weight: 700;
        color: #dff1ff;
        margin-bottom: 4px;
      }
      #partnerName {
        color: #cfe8ff;
        font-size: 15px;
        opacity: 0.95;
        margin-bottom: 12px;
      }

      /* Video container */
      .video-wrap {
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }

      #remoteVideo {
        aspect-ratio: 16 / 9;
        height: auto;
        max-height: 340px;
        width: 100%;
        object-fit: cover;
      }

      #localFloating {
        position: absolute;
        right: 34px;
        bottom: 34px;
        width: 170px;
        height: 110px;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        border: 2px solid rgba(255, 255, 255, 0.04);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        display: none;
      }

      #localFloating video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* Video controls (floating) */
      .video-action-bar {
        position: absolute;
        left: 20px;
        bottom: 28px;
        display: flex;
        gap: 10px;
        z-index: 30;
      }
      .icon-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.04);
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        color: #eaf3ff;
      }
      .icon-btn.danger {
        background: linear-gradient(90deg, #ff6b6b, #ff936b);
        color: white;
        border: 0;
        box-shadow: 0 8px 20px rgba(255, 80, 80, 0.12);
      }

      /* Right panel - chat */
      #rightPanel {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #chatCard {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border-radius: 12px;
      }

      /* Fixed height chat area */
      #messages {
        flex: 1;
        max-height: 380px; /* FIXED HEIGHT */
        overflow-y: auto; /* SCROLL ONLY INSIDE CHAT */
        padding: 12px;
        border-radius: 10px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.015),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.02);
      }

      #messages::-webkit-scrollbar {
        display: none; /* Chrome, Edge, Safari */
      }

      .msg {
        margin-bottom: 10px;
        font-size: 14px;
        line-height: 1.4;
      }
      .msg.me {
        text-align: right;
      }
      .msg .time {
        font-size: 11px;
        color: var(--muted);
        margin-left: 8px;
      }

      #typing {
        color: var(--muted);
        font-style: italic;
        padding: 0 4px;
        min-height: 20px;
      }

      /* Chat input */
      #form {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #input {
        flex: 1;
        padding: 12px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.035);
        background: transparent;
        color: #eaf3ff;
        outline: none;
      }
      #form button {
        padding: 10px 14px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        background: linear-gradient(90deg, #38bdf8, #7c5cff);
        color: white;
        font-weight: 700;
      }

      /* Online users bottom bar (Mentimeter style) */
      #onlineUsersBox {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: 14px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.02);
      }

      #onlineChips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .chip {
        padding: 8px 10px;
        border-radius: 999px;
        background: var(--chip-bg);
        border: 1px solid rgba(255, 255, 255, 0.025);
        color: #eaf3ff;
        font-size: 13px;
      }
      .chip .dot {
        width: 8px;
        height: 8px;
        background: #4cd137;
        border-radius: 50%;
        display: inline-block;
        margin-right: 8px;
        box-shadow: 0 0 10px rgba(76, 209, 55, 0.08);
      }

      /* small responsive tweaks */
      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
          padding-bottom: 120px;
        }
        #localFloating {
          display: none !important;
        }
        #onlineUsersBox {
          position: fixed;
          left: 14px;
          right: 14px;
          bottom: 18px;
          z-index: 60;
        }
      }
    </style>
  </head>

  <body>
    <!-- USERNAME MODAL -->
    <div id="usernameBox">
      <h2>Welcome — Enter your display name</h2>
      <input id="username" placeholder="Type your name..." />
      <div style="height: 12px"></div>
      <button id="joinBtn">Join Room</button>
    </div>

    <!-- APP LAYOUT -->
    <div class="app" style="display: none" id="appRoot">
      <!-- LEFT: Match + Video -->
      <div class="card" id="leftPanel">
        <div id="leftPanelHeader">
          <h2>Random Matchmaking</h2>
          <div class="small-muted">Find a stranger to chat — video & text</div>
        </div>

        <div class="controls">
          <button id="findRandomBtn" class="btn primary">Find Random</button>
          <button id="nextBtn" class="btn" disabled>Next</button>
          <button id="leaveQueueBtn" class="btn ghost" style="display: none">
            Stop Searching
          </button>
          <div style="flex: 1"></div>
          <div id="localIdentity" style="font-size: 13px; color: var(--muted)">
            You: <strong id="welcomeUsername">—</strong>
          </div>
        </div>

        <div id="matchStatus">Not searching</div>
        <div id="partnerName" style="display: none"></div>

        <div class="video-wrap" style="margin-top: 12px">
          <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div id="localFloating">
          <video id="localVideo" autoplay muted playsinline></video>
        </div>

        <div class="video-action-bar">
          <button class="icon-btn" id="muteBtn" title="Mute / Unmute">
            🎤
          </button>
          <button class="icon-btn" id="cameraBtn" title="Toggle Camera">
            📷
          </button>
          <button class="icon-btn danger" id="endCallBtn" title="End Call">
            End
          </button>
        </div>
      </div>

      <!-- RIGHT: Chat -->
      <div id="rightPanel">
        <div class="card" id="chatCard">
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            <div>
              <strong style="font-size: 15px">Private Chat</strong>
              <div style="font-size: 12px; color: var(--muted)">
                Messages with your current partner
              </div>
            </div>
            <div style="font-size: 12px; color: var(--muted)">
              Room: <span id="roomId">—</span>
            </div>
          </div>

          <div id="messages" aria-live="polite" aria-atomic="false"></div>

          <div id="typing"></div>

          <form id="form">
            <input
              id="input"
              autocomplete="off"
              placeholder="Type your message..."
            />
            <button id="sendBtn" type="submit">Send</button>
          </form>
        </div>

        <div id="onlineUsersBox">
          <div>
            <strong style="font-size: 14px">Audience</strong>
            <div style="font-size: 12px; color: var(--muted)">
              People online
            </div>
          </div>

          <div id="onlineChips"></div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();

      // DOM
      const usernameBox = document.getElementById("usernameBox");
      const usernameInput = document.getElementById("username");
      const joinBtn = document.getElementById("joinBtn");

      const appRoot = document.getElementById("appRoot");
      const welcomeUsername = document.getElementById("welcomeUsername");

      const findRandomBtn = document.getElementById("findRandomBtn");
      const nextBtn = document.getElementById("nextBtn");
      const leaveQueueBtn = document.getElementById("leaveQueueBtn");

      const matchStatus = document.getElementById("matchStatus");
      const partnerName = document.getElementById("partnerName");

      const remoteVideo = document.getElementById("remoteVideo");
      const localVideo = document.getElementById("localVideo");
      const localFloating = document.getElementById("localFloating");

      const muteBtn = document.getElementById("muteBtn");
      const cameraBtn = document.getElementById("cameraBtn");
      const endCallBtn = document.getElementById("endCallBtn");

      const messages = document.getElementById("messages");
      const input = document.getElementById("input");
      const form = document.getElementById("form");
      const typing = document.getElementById("typing");
      const roomIdEl = document.getElementById("roomId");

      const onlineChips = document.getElementById("onlineChips");

      // state
      let username = null;
      window.currentRoom = null;
      let partnerId = null;
      let pc = null;
      let localStream = null;
      let cameraEnabled = true;
      let micEnabled = true;

      // de-dup helpers
      let lastSent = { message: null, time: 0, id: null };
      // Keep a Set of appended messageIds
      const appendedMessageIds = new Set();

      const rtcConfig = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ],
      };

      // ====== JOIN FLOW ======
      joinBtn.onclick = () => {
        username = usernameInput.value.trim();
        if (!username) {
          usernameInput.focus();
          return;
        }
        socket.emit("join", username);
        welcomeUsername.textContent = username;
        usernameBox.style.display = "none";
        appRoot.style.display = "grid";
      };

      // ====== QUEUE / MATCH CONTROLS ======
      findRandomBtn.onclick = () => {
        socket.emit("findRandom");
        matchStatus.textContent = "Searching for partner...";
        partnerName.style.display = "none";
        messages.innerHTML = "";
        appendedMessageIds.clear();
        lastSent = { message: null, time: 0, id: null };
        hideLocalFloating();
        leaveQueueBtn.style.display = "inline-block";
      };

      leaveQueueBtn.onclick = () => {
        socket.emit("leaveQueue");
        leaveQueueBtn.style.display = "none";
        matchStatus.textContent = "Not searching";
      };

      nextBtn.onclick = () => {
        socket.emit("next");
        hideLocalFloating();
        messages.innerHTML = "";
        appendedMessageIds.clear();
        lastSent = { message: null, time: 0, id: null };
        partnerName.style.display = "none";
        nextBtn.disabled = true;
      };

      // ====== SOCKET EVENTS (app-level) ======
      socket.on("queued", () => {
        matchStatus.textContent = "Waiting for partner...";
      });

      socket.on("noMatch", (msg) => {
        matchStatus.textContent = msg || "No match available";
        partnerName.style.display = "none";
        hideLocalFloating();
        stopPeer();
      });

      socket.on("matched", ({ room, partnerId: pId, partnerName: pName }) => {
        window.currentRoom = room;
        roomIdEl.textContent = room;
        partnerId = pId;

        matchStatus.textContent = "Matched!";
        partnerName.style.display = "block";
        partnerName.textContent = "Connected to: " + pName;

        messages.innerHTML = "";
        appendedMessageIds.clear();
        lastSent = { message: null, time: 0, id: null };
        nextBtn.disabled = false;
        leaveQueueBtn.style.display = "none";

        const initiator = socket.id < partnerId;
        startVideoCall(initiator).catch((e) =>
          console.warn("startVideoCall err", e)
        );
      });

      socket.on("partnerLeft", () => {
        matchStatus.textContent = "Partner left.";
        partnerName.style.display = "none";
        hideLocalFloating();
        stopPeer();
      });

      // ====== CHAT ======
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!window.currentRoom) return;

        const msg = input.value.trim();
        if (!msg) return;

        // create a durable messageId (client-generated)
        const msgId =
          (socket.id || "local") +
          "_" +
          Date.now() +
          "_" +
          Math.random().toString(36).slice(2, 8);

        // store lastSent for fallback duplicate detection
        lastSent = { message: msg, time: Date.now(), id: msgId };

        // send to server - include messageId and username
        socket.emit("roomMessage", {
          room: window.currentRoom,
          message: msg,
          messageId: msgId,
          user: username,
        });

        // append local bubble (marked with data-msgid)
        appendMessage({
          user: "You",
          message: msg,
          time: new Date().toISOString(),
          self: true,
          messageId: msgId,
        });

        input.value = "";
      });

      // Server message handler - robust dedupe
      socket.on("roomMessage", ({ user, message, time, messageId }) => {
        // If server includes messageId and we've already appended it -> skip
        if (messageId && appendedMessageIds.has(messageId)) {
          return;
        }

        // Fallback: if server doesn't send messageId, ignore echoes that match our last sent msg (within 3s)
        if (
          !messageId &&
          user === username &&
          message === lastSent.message &&
          Date.now() - lastSent.time < 3000
        ) {
          return;
        }

        // Finally append and mark messageId as appended (if present)
        appendMessage({
          user,
          message,
          time: time || new Date().toISOString(),
          self: user === username ? false : false, // received messages are always appended as other
          messageId,
        });
      });

      // typing notifications
      let typingTimeout;
      input.oninput = () => {
        if (!window.currentRoom) return;
        socket.emit("roomTyping", { room: window.currentRoom, isTyping: true });
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          socket.emit("roomTyping", {
            room: window.currentRoom,
            isTyping: false,
          });
        }, 700);
      };

      socket.on("roomTyping", ({ user, isTyping }) => {
        typing.textContent = isTyping ? `${user} is typing...` : "";
      });

      // ====== ONLINE USERS ======
      socket.on("onlineUsers", (users) => {
        onlineChips.innerHTML = "";
        users.forEach((u) => {
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.innerHTML = `<span class="dot"></span>${escapeHtml(u)}`;
          onlineChips.appendChild(chip);
        });
      });

      // ====== WEBRTC SIGNALING & HANDLERS ======
      socket.on("webrtc-offer", async ({ offer }) => {
        if (!pc) await startVideoCall(false);
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit("webrtc-answer", { room: window.currentRoom, answer });
      });

      socket.on("webrtc-answer", async ({ answer }) => {
        if (pc) {
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }
      });

      socket.on("webrtc-ice", async ({ candidate }) => {
        if (pc && candidate) {
          try {
            await pc.addIceCandidate(candidate);
          } catch (err) {
            console.warn("ICE add failed", err);
          }
        }
      });

      socket.on("endCall", () => {
        hideLocalFloating();
        stopPeer();
        matchStatus.textContent = "Call ended.";
      });

      // ====== RTC FUNCTIONS ======
      async function startVideoCall(isCaller) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: true,
          });
        } catch (err) {
          console.warn("camera/mic access error", err);
          matchStatus.textContent = "Camera / Mic permission required";
          return;
        }

        // set local floating preview
        localVideo.srcObject = localStream;
        showLocalFloating();

        pc = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach((track) => {
          pc.addTrack(track, localStream);
        });

        const remoteStream = new MediaStream();
        remoteVideo.srcObject = remoteStream;

        pc.ontrack = (event) => {
          // attach tracks to remote stream
          event.streams[0].getTracks().forEach((t) => remoteStream.addTrack(t));
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit("webrtc-ice", {
              room: window.currentRoom,
              candidate: event.candidate,
            });
          }
        };

        // show UI hints
        matchStatus.textContent = "In call";
        localFloating.style.display = "block";

        if (isCaller) {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          socket.emit("webrtc-offer", {
            room: window.currentRoom,
            offer,
          });
        }
      }

      function stopPeer() {
        try {
          if (pc) pc.close();
        } catch (e) {}
        pc = null;

        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
        }
        localStream = null;
        remoteVideo.srcObject = null;
        localVideo.srcObject = null;
      }

      // ====== UI helpers ======
      function appendMessage({ user, message, time, self, messageId }) {
        // Avoid appending if messageId already appended
        if (messageId && appendedMessageIds.has(messageId)) return;

        const d = document.createElement("div");
        d.className = "msg " + (self ? "me" : "");
        if (messageId) d.setAttribute("data-msgid", messageId);

        const ts = new Date(time).toLocaleTimeString();
        d.innerHTML = self
          ? `<div style="display:inline-block; background:linear-gradient(90deg,#2b6cff,#6b58ff); padding:10px 12px; border-radius:12px; color:white; max-width:85%;">${escapeHtml(
              message
            )} <div style="font-size:11px; opacity:0.85; margin-top:6px; text-align:right;"><span class="time">${ts}</span></div></div>`
          : `<div style="display:inline-block; background:rgba(255,255,255,0.02); padding:10px 12px; border-radius:12px; color:#eaf3ff; max-width:85%;"> <strong style="font-size:13px">${escapeHtml(
              user
            )}</strong><div style="margin-top:6px">${escapeHtml(
              message
            )}</div><div style="font-size:11px; opacity:0.7; margin-top:8px;"><span class="time">${ts}</span></div></div>`;

        messages.appendChild(d);

        // mark appended id
        if (messageId) appendedMessageIds.add(messageId);

        // keep scroll at bottom
        messages.scrollTop = messages.scrollHeight;
      }

      function showLocalFloating() {
        localFloating.style.display = "block";
      }
      function hideLocalFloating() {
        localFloating.style.display = "none";
      }

      // video control buttons
      muteBtn.onclick = () => {
        if (!localStream) return;
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach((t) => (t.enabled = micEnabled));
        muteBtn.textContent = micEnabled ? "🎤" : "🔇";
      };

      cameraBtn.onclick = () => {
        if (!localStream) return;
        cameraEnabled = !cameraEnabled;
        localStream
          .getVideoTracks()
          .forEach((t) => (t.enabled = cameraEnabled));
        cameraBtn.textContent = cameraEnabled ? "📷" : "🚫";
      };

      endCallBtn.onclick = () => {
        if (!window.currentRoom) return;
        socket.emit("endCall", { room: window.currentRoom });
        hideLocalFloating();
        stopPeer();
      };

      // escape HTML utility
      function escapeHtml(unsafe) {
        if (!unsafe && unsafe !== 0) return "";
        return String(unsafe)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // graceful unload: leave queue & socket disconnect
      window.addEventListener("beforeunload", () => {
        try {
          socket.emit("leaveQueue");
        } catch (e) {}
        try {
          socket.disconnect();
        } catch (e) {}
      });

      // initial small UX: keyboard enter to join on modal
      usernameInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") joinBtn.click();
      });

      // keep messages scroll bottom on resize
      window.addEventListener("resize", () => {
        messages.scrollTop = messages.scrollHeight;
      });

      // small visual fallback if socket.io script failed to load
      setTimeout(() => {
        if (typeof io === "undefined") {
          alert(
            "socket.io.js failed to load. Make sure your server serves /socket.io/socket.io.js"
          );
        }
      }, 800);
    </script>
  </body>
</html>
