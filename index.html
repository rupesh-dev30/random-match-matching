<!DOCTYPE html>
<html>
  <head>
    <title>Random Matchmaking Chat</title>

    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #eef1f5;
      }

      #container {
        max-width: 1100px;
        margin: auto;
        margin-top: 30px;
        display: flex;
        gap: 20px;
      }

      #leftPanel {
        flex: 3;
        background: white;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      #rightPanel {
        flex: 1;
        background: white;
        border-radius: 10px;
        padding: 20px;
        height: fit-content;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin-top: 0;
        color: #333;
      }

      #welcomeBox {
        padding: 15px;
        margin-bottom: 15px;
        background: #e8f3ff;
        border-left: 4px solid #007bff;
        border-radius: 5px;
        color: #004a9f;
        font-size: 16px;
      }

      #videoArea {
        display: none;
        margin: 20px 0;
        display: flex;
        gap: 10px;
      }

      #remoteVideo {
        width: 70%;
        height: 250px;
        background: black;
        border-radius: 8px;
        object-fit: cover;
      }

      #localVideo {
        width: 28%;
        height: 120px;
        background: black;
        border-radius: 8px;
        object-fit: cover;
      }

      .videoControls {
        display: none;
        gap: 10px;
        margin-bottom: 20px;
      }

      button {
        padding: 10px 18px;
        background: #0066ff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
      }

      button:disabled {
        background: #9dbdff;
        cursor: not-allowed;
      }

      button.small {
        padding: 8px 12px;
        font-size: 14px;
      }

      #matchStatus {
        font-weight: bold;
        margin-bottom: 8px;
      }

      #partnerName {
        color: #333;
        margin-bottom: 15px;
      }

      #privateChatArea {
        display: none;
        margin-top: 20px;
      }

      #messages {
        border: 1px solid #ccc;
        height: 200px;
        overflow-y: scroll;
        padding: 10px;
        background: #fafafa;
        border-radius: 5px;
      }

      #form {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      #input {
        flex: 1;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #999;
        font-size: 15px;
      }

      #typing {
        color: gray;
        font-style: italic;
      }

      #onlineUsers li {
        list-style: none;
        padding: 8px;
        margin-bottom: 6px;
        background: #f7f9fc;
        border-radius: 5px;
        border: 1px solid #dde3ea;
      }

      #usernameBox {
        background: white;
        padding: 20px;
        text-align: center;
        max-width: 350px;
        margin: 40px auto;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      #username {
        padding: 12px;
        width: 80%;
        border-radius: 6px;
        border: 1px solid #bbb;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div id="usernameBox">
      <h2>Enter Your Name</h2>
      <input id="username" placeholder="Your name..." />
      <button id="joinBtn">Join</button>
    </div>

    <div id="container" style="display: none">
      <div id="leftPanel">
        <h2>Random Matchmaking</h2>

        <div id="welcomeBox">
          Welcome, <span id="welcomeUsername"></span> 👋
        </div>

        <div id="matchControls">
          <button id="findRandomBtn">Find Random</button>
          <button id="nextBtn" disabled>Next</button>
          <button id="leaveQueueBtn" style="display: none">
            Stop Searching
          </button>
        </div>

        <div id="matchStatus"></div>
        <div id="partnerName"></div>

        <!-- VIDEO -->
        <div id="videoArea">
          <video id="remoteVideo" autoplay playsinline></video>
          <video id="localVideo" autoplay muted playsinline></video>
        </div>

        <div class="videoControls" id="videoControls">
          <button class="small" id="muteBtn">Mute</button>
          <button class="small" id="cameraBtn">Camera Off</button>
          <button class="small" id="endCallBtn">End Call</button>
        </div>

        <!-- CHAT -->
        <div id="privateChatArea">
          <h3>Chat</h3>
          <div id="messages"></div>

          <form id="form">
            <input
              id="input"
              autocomplete="off"
              placeholder="Type a message..."
            />
            <button>Send</button>
          </form>

          <p id="typing"></p>
        </div>
      </div>

      <div id="rightPanel">
        <h3>Online Users</h3>
        <ul id="onlineUsers"></ul>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
      const socket = io();

      // DOM refs
      const usernameBox = document.getElementById("usernameBox");
      const usernameInput = document.getElementById("username");
      const joinBtn = document.getElementById("joinBtn");

      const container = document.getElementById("container");
      const welcomeUsername = document.getElementById("welcomeUsername");

      const findRandomBtn = document.getElementById("findRandomBtn");
      const nextBtn = document.getElementById("nextBtn");
      const leaveQueueBtn = document.getElementById("leaveQueueBtn");

      const matchStatus = document.getElementById("matchStatus");
      const partnerName = document.getElementById("partnerName");

      const videoArea = document.getElementById("videoArea");
      const videoControls = document.getElementById("videoControls");

      const localVideo = document.getElementById("localVideo");
      const remoteVideo = document.getElementById("remoteVideo");

      const muteBtn = document.getElementById("muteBtn");
      const cameraBtn = document.getElementById("cameraBtn");
      const endCallBtn = document.getElementById("endCallBtn");

      const privateChatArea = document.getElementById("privateChatArea");
      const messages = document.getElementById("messages");
      const input = document.getElementById("input");
      const typing = document.getElementById("typing");
      const form = document.getElementById("form");

      const onlineUsers = document.getElementById("onlineUsers");

      let username = null;
      window.currentRoom = null;
      let partnerId = null;

      // WebRTC
      let pc = null;
      let localStream = null;
      let cameraEnabled = true;
      let micEnabled = true;

      const rtcConfig = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
        ],
      };

      joinBtn.onclick = () => {
        username = usernameInput.value.trim();
        if (!username) return;
        socket.emit("join", username);

        welcomeUsername.textContent = username;
        usernameBox.style.display = "none";
        container.style.display = "flex";
      };

      findRandomBtn.onclick = () => {
        socket.emit("findRandom");
        matchStatus.textContent = "Searching for partner...";
        partnerName.textContent = "";
        privateChatArea.style.display = "none";
        hideVideo();
        leaveQueueBtn.style.display = "inline-block";
      };

      leaveQueueBtn.onclick = () => {
        socket.emit("leaveQueue");
        leaveQueueBtn.style.display = "none";
      };

      nextBtn.onclick = () => {
        socket.emit("next");
        hideVideo();
        privateChatArea.style.display = "none";
        partnerName.textContent = "";
        nextBtn.disabled = true;
      };

      socket.on("queued", () => {
        matchStatus.textContent = "Waiting for partner...";
      });

      socket.on("noMatch", (msg) => {
        matchStatus.textContent = msg;
        partnerName.textContent = "";
        privateChatArea.style.display = "none";
        hideVideo();
      });

      socket.on("matched", ({ room, partnerId: pId, partnerName: pName }) => {
        window.currentRoom = room;
        partnerId = pId;

        matchStatus.textContent = "Matched!";
        partnerName.textContent = "Connected to: " + pName;

        privateChatArea.style.display = "block";
        nextBtn.disabled = false;
        leaveQueueBtn.style.display = "none";
        messages.innerHTML = "";

        const initiator = socket.id < partnerId;
        startVideoCall(initiator);
      });

      socket.on("partnerLeft", () => {
        matchStatus.textContent = "Partner left.";
        hideVideo();
        stopPeer();
      });

      // -----------------------------
      // CHAT
      // -----------------------------
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!window.currentRoom) return;

        const msg = input.value.trim();
        if (!msg) return;

        socket.emit("roomMessage", { room: window.currentRoom, message: msg });
        input.value = "";
      });

      socket.on("roomMessage", ({ user, message, time }) => {
        addMessage(
          `[${new Date(time).toLocaleTimeString()}] ${user}: ${message}`
        );
      });

      let typingTimeout;
      input.oninput = () => {
        if (!window.currentRoom) return;

        socket.emit("roomTyping", { room: window.currentRoom, isTyping: true });

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          socket.emit("roomTyping", {
            room: window.currentRoom,
            isTyping: false,
          });
        }, 700);
      };

      socket.on("roomTyping", ({ user, isTyping }) => {
        typing.textContent = isTyping ? `${user} is typing...` : "";
      });

      // -----------------------------
      // ONLINE USERS
      // -----------------------------
      socket.on("onlineUsers", (users) => {
        onlineUsers.innerHTML = "";
        users.forEach((u) => {
          const li = document.createElement("li");
          li.textContent = u;
          onlineUsers.appendChild(li);
        });
      });

      // -----------------------------
      // WEBRTC SIGNAL HANDLERS
      // -----------------------------
      socket.on("webrtc-offer", async ({ offer }) => {
        if (!pc) await startVideoCall(false);

        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        socket.emit("webrtc-answer", { room: window.currentRoom, answer });
      });

      socket.on("webrtc-answer", async ({ answer }) => {
        if (pc) {
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }
      });

      socket.on("webrtc-ice", async ({ candidate }) => {
        if (pc && candidate) {
          try {
            await pc.addIceCandidate(candidate);
          } catch (err) {}
        }
      });

      socket.on("endCall", () => {
        hideVideo();
        stopPeer();
        matchStatus.textContent = "Call ended.";
      });

      // -----------------------------
      // RTC FUNCTIONS
      // -----------------------------
      async function startVideoCall(isCaller) {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true,
        });

        localVideo.srcObject = localStream;

        pc = new RTCPeerConnection(rtcConfig);

        localStream.getTracks().forEach((track) => {
          pc.addTrack(track, localStream);
        });

        const remoteStream = new MediaStream();
        remoteVideo.srcObject = remoteStream;

        pc.ontrack = (event) => {
          event.streams[0].getTracks().forEach((t) => remoteStream.addTrack(t));
        };

        pc.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit("webrtc-ice", {
              room: window.currentRoom,
              candidate: event.candidate,
            });
          }
        };

        showVideo();

        if (isCaller) {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          socket.emit("webrtc-offer", {
            room: window.currentRoom,
            offer,
          });
        }
      }

      function stopPeer() {
        if (pc) pc.close();
        pc = null;

        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
        }

        localStream = null;
      }

      function showVideo() {
        videoArea.style.display = "flex";
        videoControls.style.display = "flex";
      }

      function hideVideo() {
        videoArea.style.display = "none";
        videoControls.style.display = "none";
      }

      // -----------------------------
      // VIDEO CONTROLS
      // -----------------------------
      muteBtn.onclick = () => {
        if (!localStream) return;
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach((t) => (t.enabled = micEnabled));
        muteBtn.textContent = micEnabled ? "Mute" : "Unmute";
      };

      cameraBtn.onclick = () => {
        if (!localStream) return;
        cameraEnabled = !cameraEnabled;
        localStream
          .getVideoTracks()
          .forEach((t) => (t.enabled = cameraEnabled));
        cameraBtn.textContent = cameraEnabled ? "Camera Off" : "Camera On";
      };

      endCallBtn.onclick = () => {
        if (!window.currentRoom) return;

        socket.emit("endCall", { room: window.currentRoom });
        hideVideo();
        stopPeer();
      };

      function addMessage(msg) {
        const div = document.createElement("div");
        div.textContent = msg;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }
    </script>
  </body>
</html>
